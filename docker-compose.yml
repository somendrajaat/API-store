version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: apistore-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

  app:
    build: .

    container_name: apistore-app

    depends_on:
      - postgres
      - redis

    ports:
      - "8080:8080"

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      SECRET_KEY: ${SECRET_KEY}
      JWT_EXPIRE_TIME: ${JWT_EXPIRE_TIME}

volumes:
  postgres-data: